# RecipeBoxer Model Pricing Configuration
# User-editable price table keyed by Gemini model ID.
# All rates are USD per million tokens (MTok), Standard (non-batch) paid tier.
#
# Verified 2026-10-14 against https://ai.google.dev/gemini-api/docs/pricing
# Google bills thinking tokens at the output rate ("Output price (including
# thinking tokens)"), so thinking_per_mtok == output_per_mtok.
#
# PROMOTIONAL RATES: several Flash prices below are temporary. The engine has
# no date-aware pricing, so update this file when the promotion ends:
#   gemini-3.8-flash: $0.75/$3.75 through 2026-12-31, then $1.50/$7.50
#   gemini-3.6-flash: $0.75/$3.75 through 2026-12-31, then $1.50/$7.50
#
# Models that are NOT listed are treated as unpriced (cost = None + warning),
# never as free. gemini-3.7-flash exists in models.list but is absent from the
# pricing page as of 2026-10-14, so it is deliberately left unpriced.
#
# Free tier: these models are "Free of charge" but limited to very low request
# quotas (observed: 20 generateContent requests/day/model), Pro models are not
# available, and Google may use free-tier content to improve its products.

